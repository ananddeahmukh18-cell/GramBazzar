      const addr = window.GB_ADDRESS || { line1: "Rashin", line2: "414403", landmark: "" };
      const addressString = `${addr.line1}, ${addr.line2} ${addr.landmark ? '(Near: '+addr.landmark+')' : ''}`;

      // Use the global WhatsApp routing function
      if (typeof gbCreateWhatsAppOrder === 'function') {
        const order = gbCreateWhatsAppOrder(cart, addressString, user.name);
        GB.toast("Order placed! Redirecting...", "✅");
      } else {
        GB.toast("WhatsApp routing initialized.", "✅");
      }
      
      // Clear Cart securely
      cart = [];
      localStorage.setItem('gb_cart_master', '[]');
      syncUI();
      
      // Close all UI elements and show GPS
      closeAllModals();
      const cartDrawer = $('cartDrawer');
      if (cartDrawer) {
        cartDrawer.style.transform = 'translateX(100%)';
        $('cartOverlay').style.opacity = '0';
        $('cartOverlay').style.pointerEvents = 'none';
      }
      
      // Wait for WhatsApp to open, then show GPS Tracking
      setTimeout(() => { 
        if (typeof gbShowTracking === 'function') {
           // If the global tracker is available, use it
           const latestOrder = JSON.parse(localStorage.getItem("gb_orders")||"[]")[0];
           if(latestOrder) gbShowTracking(latestOrder.trackingId);
        } else {
           // Fallback to demo modal
           openModal('gpsModal'); 
        }
      }, 1200);
    };
